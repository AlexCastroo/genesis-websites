translationKey: "congelar-bono"
order: 3
category: "Precios y reservas"
q: "¿Puedo congelar mi bono si viajo?"
a: "Sí. Si vas a ausentarte de Madrid por trabajo, vacaciones o prescripción médica durante más de 10 días seguidos, pausamos la vigencia de tu bono hasta un máximo de 30 días naturales con un simple mensaje."
