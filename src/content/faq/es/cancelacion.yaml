translationKey: "cancelacion"
order: 1
category: "Precios y reservas"
q: "¿Qué política de cancelación tenéis?"
a: "Permitimos cancelar o reprogramar sin ningún coste hasta 12 horas antes del inicio de la sesión a través de la web o por WhatsApp. Si cancelas fuera de plazo, la sesión se descuenta automáticamente de tu bono."
