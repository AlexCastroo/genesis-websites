q: '¿Necesito experiencia previa con máquinas Reformer?'
a: 'En absoluto. Para quienes no han utilizado un Reformer antes recomendamos la Clase de Prueba Primerizos, en la que la instructora te enseña a calibrar los muelles, ajustar las correas y moverte con total seguridad.'
