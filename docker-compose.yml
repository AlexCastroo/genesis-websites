services:
  web:
    build:
      context: .
      args:
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-}
        PUBLIC_CONTACT_ENDPOINT: ${PUBLIC_CONTACT_ENDPOINT:-}
    environment:
      CONTACT_ORIGIN: ${CONTACT_ORIGIN:-}
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /etc/nginx/conf.d:mode=1777
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
